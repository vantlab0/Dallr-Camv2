name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Typecheck and build frontend
        run: npm run build

  unit-and-integration-tests:
    name: Unit & Frontend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm test

  database-migrations:
    name: Database Migrations & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PostgreSQL with pg_cron
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib postgresql-16-cron
          sudo bash -c 'echo "shared_preload_libraries = '\''pg_cron'\''" >> /etc/postgresql/16/main/postgresql.conf'
          sudo bash -c 'echo "cron.database_name = '\''dallr_integration_test'\''" >> /etc/postgresql/16/main/postgresql.conf'
          sudo service postgresql restart

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run database migration and lease bounding tests
        run: python3 scripts/test-database-integration.py

  tauri-cargo-check:
    name: Tauri Rust Backend Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies for Tauri on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target

      - name: Cargo check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
