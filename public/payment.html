<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paystack Payment — Dallr Cam</title>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 { font-size: 20px; margin-bottom: 8px; color: #f4f4f5; }
    p.subtitle { font-size: 13px; color: #a1a1aa; margin-bottom: 24px; }
    .detail {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #1f1f24;
      font-size: 13px;
    }
    .detail .label { color: #a1a1aa; }
    .detail .value { color: #f4f4f5; font-family: monospace; }
    .detail .value.highlight { color: #22c55e; font-weight: bold; }
    #status {
      margin-top: 24px;
      font-size: 13px;
      text-align: center;
      color: #a1a1aa;
      min-height: 20px;
    }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #27272a;
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      background: #ef4444;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #dc2626; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dallr Cam — Paystack</h1>
    <p class="subtitle">Secure payment for Dallr Cam wallet top-up</p>

    <div class="detail">
      <span class="label">Transaction Reference</span>
      <span class="value" id="ref-display">—</span>
    </div>
    <div class="detail">
      <span class="label">Amount (USD)</span>
      <span class="value highlight" id="usd-display">—</span>
    </div>
    <div class="detail">
      <span class="label">Amount (NGN)</span>
      <span class="value highlight" id="ngn-display">—</span>
    </div>

    <div id="status">Initializing Paystack...</div>

    <a href="#" id="reopen-btn" class="btn hidden">Reopen Payment Popup</a>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const userId = params.get('user_id') || 'unknown';
      const email = params.get('email') || '';
      const amountUsd = parseFloat(params.get('amount_usd')) || 0;
      const amountKobo = Math.round(amountUsd * 100 * 1550); // USD -> NGN kobo
      const exchangeRate = 1550;
      const reference = 'dallr_' + userId + '_' + Date.now();
      const appUrl = params.get('app_url') || window.location.origin;

      const refDisplay = document.getElementById('ref-display');
      const usdDisplay = document.getElementById('usd-display');
      const ngnDisplay = document.getElementById('ngn-display');
      const statusEl = document.getElementById('status');
      const reopenBtn = document.getElementById('reopen-btn');

      refDisplay.textContent = reference;
      usdDisplay.textContent = '$' + amountUsd.toFixed(2);
      ngnDisplay.textContent = '₦' + (amountUsd * exchangeRate).toLocaleString() + '.00';

      let paystackReady = false;
      let paystackInstance = null;

      // Wait for PaystackPop to load from CDN
      function waitForPaystack() {
        if (window.PaystackPop) {
          paystackReady = true;
          openPopup();
        } else {
          setTimeout(waitForPaystack, 500);
        }
      }

      function openPopup() {
        statusEl.textContent = 'Opening Paystack payment popup...';

        paystackInstance = window.PaystackPop.setup({
          key: 'pk_live_9ca8fd7f800eb630f535045b6a0467fc95e47f18',
          email: email,
          amount: amountKobo,
          ref: reference,
          metadata: {
            user_id: userId,
            amount_usd: amountUsd,
            app: 'Dallr Cam'
          },
          callback: function(response) {
            statusEl.textContent = 'Payment successful. Verifying with server...';
            verifyPayment(reference);
          },
          onClose: function() {
            statusEl.textContent = 'Payment popup closed. You can retry below.';
            reopenBtn.classList.remove('hidden');
          }
        });

        paystackInstance.openIframe();
      }

      async function verifyPayment(reference) {
        try {
          const supabaseUrl = 'https://itsxgmkhdvivyhmbyblo.supabase.co';
          const res = await fetch(supabaseUrl + '/functions/v1/verify-payment', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + (params.get('access_token') || '')
            },
            body: JSON.stringify({ reference: reference })
          });

          const data = await res.json();

          if (data.status === 'success' || data.already_processed) {
            statusEl.textContent = 'Payment verified successfully!';
            setTimeout(function() {
              window.location.href = appUrl + '?payment=success&reference=' + reference;
            }, 1500);
          } else {
            statusEl.textContent = 'Payment verification failed: ' + (data.message || 'Unknown error');
            reopenBtn.classList.remove('hidden');
          }
        } catch (err) {
          statusEl.textContent = 'Verification error: ' + err.message;
          reopenBtn.classList.remove('hidden');
        }
      }

      reopenBtn.addEventListener('click', function(e) {
        e.preventDefault();
        statusEl.textContent = 'Reopening Paystack popup...';
        if (paystackInstance) {
          paystackInstance.openIframe();
        }
      });

      if (window.PaystackPop) {
        paystackReady = true;
        openPopup();
      } else {
        waitForPaystack();
      }
    })();
  </script>
</body>
</html>
